name: GoCI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    paths:
      - .golangci.yml
      - '**/*.go'
      - go.sum
      - main.go

permissions:
  contents: read # Needed for checkout

jobs:
  go_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4.0.0
    - uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
      with:
        go-version-file: go.mod
    - name: go test
      run: go test -v -vet=off -buildvcs=false ./...

  golangci-lint:
    needs: [go_test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4.0.0
    - uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
      with:
        go-version-file: go.mod
    - run: cd tools && go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint
    - run: golangci-lint run ./...

  modernize:
    needs: [go_test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4.0.0
    - uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
      with:
        go-version-file: go.mod
    - name: Check for modern Go patterns
      run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@v0.21.0 -test ./...
