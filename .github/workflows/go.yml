name: GoCI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    paths:
      - .golangci.yml
      - '**/*.go'
      - go.sum
      - main.go

permissions:
  contents: read # Needed for checkout

jobs:
  go_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.0.0
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: go test
      run: go test -v -vet=off -buildvcs=false ./...

  golangci-lint:
    needs: [go_test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.0.0
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - run: cd tools && go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint
    - run: golangci-lint run ./...

  modernize:
    needs: [go_test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.0.0
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Check for modern Go patterns
      run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@v0.21.0 -test ./...
