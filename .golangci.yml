version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt

linters:
  default: none
  enable:
    - copyloopvar
    - dogsled
    - errcheck
    - errname
    - goconst
    - govet
    - ineffassign
    - misspell
    - mnd
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting
    - whitespace
  settings:
    goconst:
      min-occurrences: 5
      ignore-tests: true
    staticcheck:
      checks: ["all", "-ST1003", "-QF1001"]

run:
  timeout: 20m
